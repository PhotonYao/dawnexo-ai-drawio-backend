<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能体 · 登录</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0b1020;
            color: #e2e8f0;
            overflow: hidden;
        }
        .login-wrap {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            height: 100vh;
        }
        /* 左侧品牌区 */
        .brand {
            position: relative;
            background: radial-gradient(120% 120% at 20% 20%, #1e1b4b 0%, #0b1020 60%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 64px;
            overflow: hidden;
        }
        .brand::before {
            content: "";
            position: absolute;
            width: 520px; height: 520px;
            right: -160px; top: -160px;
            background: radial-gradient(circle, rgba(139,92,246,0.35), transparent 70%);
            filter: blur(20px);
        }
        .brand .logo {
            display: flex; align-items: center; gap: 12px;
            font-size: 20px; font-weight: 700; letter-spacing: .5px;
            color: #fff; margin-bottom: 40px;
        }
        .brand .logo .dot {
            width: 36px; height: 36px; border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: grid; place-items: center; font-size: 18px;
        }
        .brand img { width: 360px; max-width: 80%; border-radius: 20px; margin-bottom: 28px; }
        .brand h1 { font-size: 34px; color: #fff; line-height: 1.3; margin-bottom: 14px; }
        .brand p { color: #a5b4fc; font-size: 16px; max-width: 420px; line-height: 1.7; }
        .brand .foot { margin-top: auto; color: #475569; font-size: 13px; }
        /* 右侧表单区 */
        .panel {
            display: flex; align-items: center; justify-content: center;
            background: #0f172a;
            padding: 40px;
        }
        .card {
            width: 100%; max-width: 380px;
            background: rgba(30,41,59,0.6);
            border: 1px solid rgba(148,163,184,0.15);
            border-radius: 20px;
            padding: 40px 34px;
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }
        .card h2 { font-size: 24px; color: #fff; margin-bottom: 6px; }
        .card .sub { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; }
        .field input {
            width: 100%; height: 46px; padding: 0 14px;
            background: #0b1020; border: 1px solid rgba(148,163,184,0.25);
            border-radius: 12px; color: #e2e8f0; font-size: 15px; outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .field input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,0.25); }
        .btn {
            width: 100%; height: 48px; margin-top: 8px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none; border-radius: 12px; color: #fff;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: transform .12s, opacity .2s;
        }
        .btn:hover { opacity: .94; }
        .btn:active { transform: scale(.98); }
        .hint { margin-top: 16px; font-size: 13px; color: #64748b; text-align: center; }
        .hint b { color: #a5b4fc; }
        .err { margin-top: 14px; color: #fca5a5; font-size: 13px; text-align: center; min-height: 18px; }
        @media (max-width: 860px) {
            .login-wrap { grid-template-columns: 1fr; }
            .brand { display: none; }
        }
    </style>
</head>
<body>
<div class="login-wrap">
    <section class="brand">
        <div class="logo"><span class="dot">✦</span> AI 智能体平台</div>
        <img src="images/ai-hero.svg" alt="AI 智能体效果图">
        <h1>让每一次对话<br>都拥有智能的力量</h1>
        <p>基于多智能体编排能力，提供稳定、可扩展的对话体验。登录后即可选择智能体、创建会话并开始交流。</p>
        <div class="foot">© 2026 AI Agent Scaffold · 演示环境</div>
    </section>

    <section class="panel">
        <form class="card" id="loginForm" autocomplete="off">
            <h2>欢迎回来</h2>
            <div class="sub">请登录以继续使用智能体服务</div>
            <div class="field">
                <label for="username">账号</label>
                <input id="username" type="text" placeholder="请输入账号" value="admin">
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input id="password" type="password" placeholder="请输入密码" value="admin">
            </div>
            <button class="btn" type="submit">登 录</button>
            <div class="err" id="err"></div>
            <div class="hint">默认账号 / 密码：<b>admin / admin</b></div>
        </form>
    </section>
</div>

<script src="js/config.js"></script>
<script>
(function () {
    var COOKIE = window.APP_CONFIG.LOGIN_COOKIE;

    function getCookie(name) {
        var m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]*)'));
        return m ? decodeURIComponent(m[2]) : null;
    }
    var existing = getCookie(COOKIE);
    if (existing) {
        try {
            var p = JSON.parse(existing);
            if (p && p.user) { window.location.href = 'index.html'; return; }
        } catch (e) {}
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var u = document.getElementById('username').value.trim();
        var p = document.getElementById('password').value.trim();
        var err = document.getElementById('err');
        if (!u || !p) { err.textContent = '请输入账号和密码'; return; }

        if (u === 'admin' && p === 'admin') {
            var payload = { user: u, ts: Date.now() };
            document.cookie = COOKIE + '=' + encodeURIComponent(JSON.stringify(payload))
                + '; path=/; max-age=' + (60 * 60 * 24 * 7);
            window.location.href = 'index.html';
        } else {
            err.textContent = '账号或密码错误（演示账号 admin/admin）';
        }
    });
})();
</script>
</body>
</html>
