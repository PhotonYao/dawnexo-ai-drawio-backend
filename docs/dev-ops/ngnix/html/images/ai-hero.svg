<svg width="640" height="560" viewBox="0 0 640 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI 智能体示意图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#eef2ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="640" height="560" rx="36" fill="url(#bg)"/>
  <rect width="640" height="560" rx="36" fill="url(#glow)"/>

  <!-- 装饰圆环 -->
  <circle cx="320" cy="232" r="180" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="320" cy="232" r="140" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="320" cy="232" r="100" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>

  <!-- 中心机器人脑 -->
  <g>
    <rect x="256" y="168" width="128" height="128" rx="28" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.6"/>
    <rect x="296" y="148" width="48" height="22" rx="11" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="312" cy="159" r="4" fill="#6366f1"/>
    <circle cx="328" cy="159" r="4" fill="#6366f1"/>
    <circle cx="292" cy="212" r="12" fill="#6366f1"/>
    <circle cx="348" cy="212" r="12" fill="#6366f1"/>
    <rect x="284" y="240" width="72" height="8" rx="4" fill="#a5b4fc"/>
    <rect x="296" y="256" width="48" height="8" rx="4" fill="#c7d2fe"/>
    <!-- 脑波 -->
    <path d="M286 196 H300 L308 180 L320 210 L332 184 L340 196 H354" stroke="#6366f1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 漂浮节点 -->
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="150" cy="150" r="10"/>
    <circle cx="500" cy="140" r="8"/>
    <circle cx="120" cy="320" r="7"/>
    <circle cx="520" cy="330" r="9"/>
    <circle cx="200" cy="420" r="6"/>
    <circle cx="440" cy="430" r="7"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="2">
    <line x1="150" y1="150" x2="256" y2="196"/>
    <line x1="500" y1="140" x2="384" y2="196"/>
    <line x1="120" y1="320" x2="256" y2="296"/>
    <line x1="520" y1="330" x2="384" y2="296"/>
  </g>

  <text x="320" y="446" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">AI 智能体</text>
  <text x="320" y="482" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#e9d5ff">让对话，更智能</text>
</svg>
