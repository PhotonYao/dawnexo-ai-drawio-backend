server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://127.0.0.1:3306/xfg_frame_archetype?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15 #最小空闲连接数量
    idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
    maximum-pool-size: 25 #连接池最大连接数，默认是10
    auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
    max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
    connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
    connection-test-query: SELECT 1
  type: com.zaxxer.hikari.HikariDataSource

  config:
    import:
      - classpath:agent/agent-draw-io.yml
#      - classpath:agent/test-agent.yml
      - classpath:agent/only-one-agent.yml
      - classpath:agent/parallel_research_app.yml
  ai:
    openai:
      # 密钥从环境变量读取，本地开发在系统环境变量或 IDE 启动配置中设置 OPENAI_API_KEY
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://apihub.agnes-ai.com}
# MyBatis 配置【如需使用记得打开】
#mybatis:
#  mapper-locations: classpath:/mybatis/mapper/*.xml
#  config-location:  classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

# 跨域配置；允许的来源，多个用英文逗号分隔，* 表示全部允许
# 环境变量 CORS_ALLOWED_ORIGINS 可覆盖
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}